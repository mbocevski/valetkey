default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "uv-lock"
name = "uv lock is current"
language = "system"
entry = "uv lock --check"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --frozen ruff format"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run --frozen ruff check --fix --exit-non-zero-on-fix"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ty"
name = "ty check"
language = "system"
entry = "uv run --frozen ty check"
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "vale"
name = "vale"
language = "system"
entry = "uv run --frozen vale"
files = '\.(md|py)$'
# The first run downloads the vale binary into the virtual environment. Prek splits the files
# over several processes at once, and two of them would download it together.
require_serial = true

[[repos.hooks]]
id = "zizmor"
name = "zizmor"
language = "system"
entry = "uv run --frozen zizmor --offline"
files = '^\.github/'

[[repos.hooks]]
id = "readme-facts"
name = "README matches the code"
language = "system"
entry = "uv run --frozen python tools/readme_check.py facts"
files = '^(README\.md|docs/.*|pyproject\.toml|src/.*|tools/readme_check\.py)$'
pass_filenames = false

[[repos.hooks]]
id = "readme-style"
name = "README stays short and plain"
language = "system"
entry = "uv run --frozen python tools/readme_check.py style"
files = '^(README\.md|docs/.*|tools/readme_check\.py)$'
pass_filenames = false

[[repos.hooks]]
id = "readme-impact"
name = "README updated for user-visible changes"
language = "system"
entry = "uv run --frozen python tools/readme_check.py commit-msg"
stages = ["commit-msg"]

[[repos.hooks]]
id = "agent-browser-version"
name = "agent-browser versions agree"
language = "system"
entry = "uv run --frozen python tools/version_check.py"
files = '^(\.github/workflows/ci\.yml|packaging/arch/PKGBUILD|src/valetkey/sessions\.py|tools/version_check\.py)$'
pass_filenames = false

[[repos.hooks]]
id = "changelog-lint"
name = "CHANGELOG records user-facing changes"
language = "system"
entry = "uv run --frozen python tools/changelog_check.py lint"
files = '^(CHANGELOG\.md|pyproject\.toml|tools/(changelog_check|conventional)\.py)$'
pass_filenames = false

[[repos.hooks]]
id = "changelog-impact"
name = "CHANGELOG updated for user-facing commits"
language = "system"
entry = "uv run --frozen python tools/changelog_check.py commit-msg"
stages = ["commit-msg"]

[[repos.hooks]]
id = "conventional-commit"
name = "conventional commit message"
language = "pygrep"
entry = '\A(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: \S'
args = ["--negate"]
stages = ["commit-msg"]
