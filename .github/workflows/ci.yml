name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run prek run --all-files --show-diff-on-failure

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pytest -n auto --dist loadfile

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - run: uvx --from dist/valetkey-*.whl valetkey --version

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # valetkey targets Arch Linux, and these tests need current sway, wayvnc and Chromium, so
      # they run in an Arch container. Ubuntu 24.04's sway does not report a window's sandbox
      # engine and its wayvnc cannot listen on a unix socket. The image is pinned by digest; the
      # packages inside are whatever Arch has when the job runs.
      ARCH_IMAGE: archlinux@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
      # The tested agent-browser release and the SHA-256 of its linux-x64 binary.
      AGENT_BROWSER_VERSION: 0.40.0
      AGENT_BROWSER_SHA256: da26cc8029c004325b960fa955951063380cb61e622cc580fd5adf3aa89e4676
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04 stops unprivileged processes from creating user namespaces, which is all
      # bubblewrap needs. The setting belongs to the host's kernel, and a privileged container
      # counts as unconfined, so it is changed here, on the virtual machine, before the container
      # starts. The machine is thrown away afterwards. The file is missing on kernels without the
      # setting, such as the one behind a local act run.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # --privileged lets the container create the user namespaces bubblewrap needs.
      - name: Run the integration tests in an Arch container
        run: |
          docker run --rm --privileged \
            -e AGENT_BROWSER_VERSION -e AGENT_BROWSER_SHA256 \
            -v "$GITHUB_WORKSPACE:/src:ro" "$ARCH_IMAGE" bash /src/tools/ci/integration.sh
